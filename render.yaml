services:
  - type: web
    name: kaizen
    runtime: docker
    plan: 1c-2g
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    disk:
      name: kaizen-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: KAIZEN_CONFIDENTIAL
        value: "1"
      - key: KAIZEN_AI_PROVIDER
        value: "null"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: KAIZEN_ADMIN_EMAIL
        value: rahulreddy.basireddy@bd.com
      - key: KAIZEN_ADMIN_PASSWORD
        sync: false
      - key: KAIZEN_WORKSPACE
        value: /var/data/kaizen
      - key: KAIZEN_HOSTED
        value: "1"
      - key: KAIZEN_SECURE_COOKIES
        value: "1"
